<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Personal Hub – Demo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8eef9;background:#0b1220}*{box-sizing:border-box}body{margin:0}.app{max-width:1120px;margin:auto;padding:30px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:12px;letter-spacing:.2em;color:#8eb9ff;font-weight:800}.demo{border:1px solid #466189;border-radius:30px;padding:7px 12px;color:#a9c7f8;font-size:12px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.05em;margin:18px 0 6px}p{color:#a0aec2;line-height:1.55}.nav{display:flex;gap:8px;overflow:auto;padding:18px 0 26px}.nav button{background:#1c293d;color:#bdcbe0}.nav button.active{background:#3676e9;color:#fff}button{border:0;border-radius:11px;padding:12px 16px;background:#3676e9;color:white;font:inherit;cursor:pointer}button:hover{filter:brightness(1.12)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:#151f30;border:1px solid #2c3a50;border-radius:18px;padding:22px}.card b{font-size:32px;display:block;margin-bottom:5px}.card span,.muted{color:#9eacc1;font-size:13px}.panel{margin-top:16px}h2{font-size:18px;margin:0 0 16px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #2a3850}.item label{display:flex;gap:12px;align-items:center}.item input[type=checkbox]{width:18px;height:18px;accent-color:#3676e9}.done{text-decoration:line-through;color:#8393aa}.item small{color:#92a5be}.form{display:flex;flex-wrap:wrap;gap:9px}input:not([type=checkbox]),select{flex:1;min-width:150px;padding:12px;background:#0c1524;color:#fff;border:1px solid #3b4a61;border-radius:10px;font:inherit}.danger{background:transparent;color:#ffb0b0;padding:6px 10px}.tag{background:#253a56;color:#bed7ff;padding:5px 9px;border-radius:20px;font-size:12px}.mail{align-items:flex-start}.mail div:first-child{flex:1}.mail strong{display:block;margin-bottom:5px}.mail p{margin:5px 0;font-size:13px}.notice{background:#102b3d;border:1px solid #245878;padding:14px;border-radius:12px;color:#b6d9e8;margin:15px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#234c7b;padding:12px 18px;border-radius:12px;display:none;z-index:5}footer{text-align:center;color:#6f819a;font-size:12px;padding:36px}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:#263750}.pill{padding:6px 10px;border-radius:20px;background:#233854;color:#c4d7f3;font-size:12px}@media(max-width:640px){.app{padding:18px 13px 90px}.card,.panel{padding:15px}.cards{gap:7px}.card b{font-size:26px}.card span{font-size:11px}.item{align-items:flex-start}.nav{position:sticky;top:0;background:#0b1220;z-index:3}.top{align-items:flex-start}}
</style></head><body><main class="app"><div class="top"><div class="brand">PERSONAL HUB</div><span class="demo">● DEMO · без реальных данных</span></div><h1 id="heading">Мой день</h1><p id="subtitle">Задачи, письма, встречи – всё в одном месте.</p><nav class="nav" id="nav"></nav><div id="content"></div><footer>Personal Hub · GitHub Pages demo · данные сохраняются только в этом браузере</footer></main><div id="toast" class="toast" role="status"></div>
<script>
const seed={tasks:[{id:1,title:'Проверить дизайн Personal Hub',done:false,priority:'high',date:'2026-11-10',project:'Разработка'},{id:2,title:'Подготовить документы',done:false,priority:'normal',date:'2026-11-11',project:'Личное'},{id:3,title:'Проверить результаты тестов',done:true,priority:'normal',date:'2026-11-09',project:'Разработка'}],projects:['Разработка','Личное'],events:[{id:1,title:'Планирование недели',date:'2026-11-10T10:00'},{id:2,title:'Обсуждение проекта',date:'2026-11-11T15:30'}],notifications:[{id:1,text:'Напоминание: проверить дизайн Personal Hub',channel:'Telegram',read:false},{id:2,text:'Событие «Планирование недели»',channel:'Push',read:false}],settings:{push:true,telegram:true,max:false}};
let state;try{state=JSON.parse(localStorage.getItem('personal-hub-demo-v1'))||structuredClone(seed)}catch{state=structuredClone(seed)}let tab='today';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('personal-hub-demo-v1',JSON.stringify(state));const toast=s=>{const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};const item=t=>'<div class="item"><label><input type="checkbox" data-toggle="'+t.id+'" '+(t.done?'checked':'')+'><span class="'+(t.done?'done':'')+'">'+esc(t.title)+'</span></label><div class="actions"><span class="pill">'+esc(t.project)+'</span><button class="danger" data-delete="'+t.id+'" aria-label="Удалить задачу">×</button></div></div>';
function render(){const tabs={today:'Главная',tasks:'Задачи',calendar:'Календарь',mail:'Почта',notifications:'Уведомления',accounts:'Подключения'};$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+v+'</button>').join('');$('heading').textContent=({today:'Мой день',tasks:'Задачи',calendar:'Календарь',mail:'Почта',notifications:'Уведомления',accounts:'Подключения'})[tab];let html='';
if(tab==='today'){html='<div class="cards"><div class="card"><b>'+state.tasks.filter(x=>!x.done).length+'</b><span>Активных задач</span></div><div class="card"><b>'+state.events.length+'</b><span>Событий</span></div><div class="card"><b>'+state.notifications.filter(x=>!x.read).length+'</b><span>Уведомлений</span></div></div><section class="panel"><h2>Мои задачи</h2>'+state.tasks.filter(x=>!x.done).map(item).join('')+'</section><section class="panel"><h2>Ближайшие встречи</h2>'+state.events.map(e=>'<div class="item"><span>'+esc(e.title)+'</span><small>'+esc(e.date.replace('T',' '))+'</small></div>').join('')+'</section>'}
if(tab==='tasks'){html='<section class="panel"><h2>Создать задачу</h2><form id="task-form" class="form"><input name="title" placeholder="Что нужно сделать?" maxlength="240" required><select name="project">'+state.projects.map(p=>'<option>'+esc(p)+'</option>').join('')+'</select><input type="date" name="date"><button>Добавить</button></form></section><section class="panel"><h2>Список задач</h2>'+state.tasks.map(item).join('')+'</section><section class="panel"><h2>Проекты</h2><form id="project-form" class="form"><input name="project" placeholder="Название проекта" required maxlength="120"><button>Создать проект</button></form><p>'+state.projects.map(esc).join(' · ')+'</p></section>'}
if(tab==='calendar'){html='<section class="panel"><h2>Новое событие</h2><form id="event-form" class="form"><input name="title" placeholder="Название встречи" required><input type="datetime-local" name="date" required><button>Добавить</button></form></section><section class="panel"><h2>События календаря</h2>'+state.events.map(e=>'<div class="item"><span>'+esc(e.title)+'</span><div><small>'+esc(e.date.replace('T',' '))+'</small> <button class="danger" data-event-delete="'+e.id+'">×</button></div></div>').join('')+'</section>'}
if(tab==='mail'){html='<div class="notice">Демонстрационные письма. Реальные Gmail, Outlook и Яндекс пока не подключены.</div><section class="panel"><h2>Входящие</h2>'+[{from:'Команда проекта',title:'Макеты интерфейса',body:'Пожалуйста, проверьте обновлённую главную страницу.'},{from:'Календарь',title:'Приглашение на встречу',body:'Обсуждение проекта запланировано на завтра.'},{from:'Сервис уведомлений',title:'Настройка Telegram',body:'Подключите бота после развёртывания сервера.'}].map((m,i)=>'<div class="item mail"><div><small>'+esc(m.from)+'</small><strong>'+esc(m.title)+'</strong><p>'+esc(m.body)+'</p></div><button data-mail-task="'+i+'">В задачу</button></div>').join('')+'</section>'}
if(tab==='notifications'){html='<div class="notice">Отправка в Telegram, MAX и Web Push здесь имитируется – сообщения не уходят в мессенджеры.</div><section class="panel"><h2>Каналы</h2>'+Object.entries({push:'Web Push',telegram:'Telegram',max:'MAX'}).map(([k,v])=>'<div class="item"><label><input type="checkbox" data-channel="'+k+'" '+(state.settings[k]?'checked':'')+'>'+v+'</label><span class="muted">демо</span></div>').join('')+'<div class="actions" style="margin-top:16px"><button id="test-notify">Создать тестовое уведомление</button></div></section><section class="panel"><h2>История</h2>'+state.notifications.map(n=>'<div class="item"><div><span>'+esc(n.text)+'</span><p>'+esc(n.channel)+' · '+(n.read?'Прочитано':'Новое')+'</p></div><button data-read="'+n.id+'" class="ghost">Прочитано</button></div>').join('')+'</section>'}
if(tab==='accounts'){html='<div class="notice">Демо не запрашивает логины, пароли или OAuth-токены. Для подключения настоящих аккаунтов нужен защищённый сервер.</div><section class="panel"><h2>Источники данных</h2>'+[['Google','Gmail и Google Calendar'],['Microsoft','Outlook и Microsoft 365'],['Яндекс','Почта и Календарь']].map(([name,detail])=>'<div class="item"><div><strong>'+name+'</strong><p>'+detail+'</p></div><span class="pill">Не подключено</span></div>').join('')+'</section><section class="panel"><h2>Демо-данные</h2><p>Можно вернуть исходные тестовые задачи, встречи и уведомления.</p><button id="reset" class="ghost">Сбросить демо</button></section>'}
$('content').innerHTML=html}
document.addEventListener('click',e=>{const x=e.target;if(x.dataset.tab){tab=x.dataset.tab;render()}if(x.dataset.delete){state.tasks=state.tasks.filter(t=>t.id!==Number(x.dataset.delete));save();render()}if(x.dataset.eventDelete){state.events=state.events.filter(t=>t.id!==Number(x.dataset.eventDelete));save();render()}if(x.dataset.mailTask!==undefined){const titles=['Проверить макеты интерфейса','Подготовиться к встрече','Настроить Telegram-бота'];state.tasks.unshift({id:Date.now(),title:titles[Number(x.dataset.mailTask)],done:false,priority:'normal',date:'',project:state.projects[0]});save();toast('Задача создана из письма');render()}if(x.dataset.read){const n=state.notifications.find(n=>n.id===Number(x.dataset.read));if(n)n.read=true;save();render()}if(x.id==='test-notify'){state.notifications.unshift({id:Date.now(),text:'Тестовое уведомление Personal Hub',channel:Object.keys(state.settings).filter(k=>state.settings[k]).join(', ')||'В приложении',read:false});save();toast('Тестовое уведомление создано');render()}if(x.id==='reset'){state=structuredClone(seed);save();render();toast('Демо сброшено')}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.toggle){const t=state.tasks.find(t=>t.id===Number(x.dataset.toggle));if(t)t.done=x.checked;save();render()}if(x.dataset.channel){state.settings[x.dataset.channel]=x.checked;save();render()}});
document.addEventListener('submit',e=>{if(!['task-form','project-form','event-form'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='task-form'){state.tasks.unshift({id:Date.now(),title:String(f.get('title')).trim(),project:String(f.get('project')),date:String(f.get('date')),done:false,priority:'normal'})}if(e.target.id==='project-form'){const p=String(f.get('project')).trim();if(p&&!state.projects.includes(p))state.projects.push(p)}if(e.target.id==='event-form'){state.events.push({id:Date.now(),title:String(f.get('title')).trim(),date:String(f.get('date'))})}save();render();toast('Сохранено в деморежиме')});render();
</script></body></html>
